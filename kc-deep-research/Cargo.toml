[package]
name = "deep-research"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "deep-research"
path = "src/main.rs"

# sdk.rs/protocol.rs are the vendored karucode SDK. mcp.rs is the same supervised
# stdio client used by kc-free-search; the only dependencies are wire JSON types.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
